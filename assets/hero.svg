<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="sceneSvg" viewBox="0 0 1200 700" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Deep Cosmic Gradients -->
    <radialGradient id="voidGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#14171d"/>
      <stop offset="45%" stop-color="#0a0c10"/>
      <stop offset="85%" stop-color="#050608"/>
      <stop offset="100%" stop-color="#020304"/>
    </radialGradient>

    <!-- Nebula Cloud Gradients -->
    <radialGradient id="nebulaA" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#222834" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#151922" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaB" cx="60%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#1e2621" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#121816" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Brushed Gunmetal & Obsidian Gradients -->
    <linearGradient id="gunmetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a525d"/>
      <stop offset="25%" stop-color="#2a2e36"/>
      <stop offset="50%" stop-color="#383e49"/>
      <stop offset="75%" stop-color="#1a1c22"/>
      <stop offset="100%" stop-color="#2f3540"/>
    </linearGradient>

    <linearGradient id="gunmetalSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#737e8d" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#3e4550" stop-opacity="0.3"/>
      <stop offset="55%" stop-color="#181b20" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4d5562" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="edgeGleamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a6575" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a4b3c6" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#5a6575" stop-opacity="0"/>
    </linearGradient>

    <!-- Shading & Depth Filters -->
    <filter id="obsidianDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blurDeep"/>
      <feOffset in="blurDeep" dx="0" dy="12" result="offsetDeep"/>
      <feFlood flood-color="#000000" flood-opacity="0.95" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetDeep" operator="in" result="shadow1"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blurMid"/>
      <feOffset in="blurMid" dx="0" dy="4" result="offsetMid"/>
      <feFlood flood-color="#05070a" flood-opacity="0.8" result="midColor"/>
      <feComposite in="midColor" in2="offsetMid" operator="in" result="shadow2"/>

      <feMerge>
        <feMergeNode in="shadow1"/>
        <feMergeNode in="shadow2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Brushed Noise Texture -->
    <filter id="metalNoise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65 0.05" numOctaves="3" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.22  0 0 0 0 0.26  0 0 0 0.09 0" result="coloredNoise"/>
      <feComposite in="SourceGraphic" in2="coloredNoise" operator="over"/>
    </filter>

    <!-- Nebula Displacement Filter -->
    <filter id="nebulaDust" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" result="cloudTurb"/>
      <feDisplacementMap in="SourceGraphic" in2="cloudTurb" scale="35" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <!-- Tech HUD Crosshair Reticle -->
    <g id="hudReticle">
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#485363" stroke-width="0.8" stroke-opacity="0.4"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#485363" stroke-width="0.8" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#36404e" stroke-width="0.6" stroke-dasharray="2, 6" opacity="0.5"/>
    </g>

    <!-- Miniature Autonomous Robotic Probe -->
    <g id="microDrone">
      <polygon points="0,-7 6,4 0,2 -6,4" fill="#20242b" stroke="#4a5566" stroke-width="0.7"/>
      <circle cx="0" cy="0" r="1.2" fill="#718299" opacity="0.8"/>
      <line x1="-10" y1="0" x2="-6" y2="0" stroke="#374151" stroke-width="0.5"/>
      <line x1="6" y1="0" x2="10" y2="0" stroke="#374151" stroke-width="0.5"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#2c3542" stroke-width="0.4" stroke-dasharray="2,4" opacity="0.35"/>
    </g>

    <!-- OpenAI Silhouette Embedded Sub-Asset -->
    <g id="aiSilhouetteNode">
      <path fill="#262d38" fill-rule="evenodd" d="M9.205 8.658v-2.26c0-.19.072-.333.238-.428l4.543-2.616c.619-.357 1.356-.523 2.117-.523 2.854 0 4.662 2.212 4.662 4.566 0 .167 0 .357-.024.547l-4.71-2.759a.797.797 0 00-.856 0l-5.97 3.473zm10.609 8.8V12.06c0-.333-.143-.57-.429-.737l-5.97-3.473 1.95-1.118a.433.433 0 01.476 0l4.543 2.617c1.309.76 2.189 2.378 2.189 3.948 0 1.808-1.07 3.473-2.76 4.163zM7.802 12.703l-1.95-1.142c-.167-.095-.239-.238-.239-.428V5.899c0-2.545 1.95-4.472 4.591-4.472 1 0 1.927.333 2.712.928L8.23 5.067c-.285.166-.428.404-.428.737v6.898zM12 15.128l-2.795-1.57v-3.33L12 8.658l2.795 1.57v3.33L12 15.128zm1.796 7.23c-1 0-1.927-.332-2.712-.927l4.686-2.712c.285-.166.428-.404.428-.737v-6.898l1.974 1.142c.167.095.238.238.238.428v5.233c0 2.545-1.974 4.472-4.614 4.472zm-5.637-5.303l-4.544-2.617c-1.308-.761-2.188-2.378-2.188-3.948A4.482 4.482 0 014.21 6.327v5.423c0 .333.143.571.428.738l5.947 3.449-1.95 1.118a.432.432 0 01-.476 0zm-.262 3.9c-2.688 0-4.662-2.021-4.662-4.519 0-.19.024-.38.047-.57l4.686 2.71c.286.167.571.167.856 0l5.97-3.448v2.26c0 .19-.07.333-.237.428l-4.543 2.616c-.619.357-1.356.523-2.117.523zm5.899 2.83a5.947 5.947 0 005.827-4.756C22.287 18.339 24 15.84 24 13.296c0-1.665-.713-3.282-1.998-4.448.119-.5.19-.999.19-1.498 0-3.401-2.759-5.947-5.946-5.947-.642 0-1.26.095-1.88.31A5.962 5.962 0 0010.205 0a5.947 5.947 0 00-5.827 4.757C1.713 5.447 0 7.945 0 10.49c0 1.666.713 3.283 1.998 4.448-.119.5-.19 1-.19 1.499 0 3.401 2.759 5.946 5.946 5.946.642 0 1.26-.095 1.88-.309a5.96 5.96 0 004.162 1.713z"/>
    </g>

    <!-- Hero Text Clip Mask -->
    <clipPath id="textClipMask">
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-family="'Space Grotesk', 'Syne', -apple-system, sans-serif" font-size="78" font-weight="900" letter-spacing="12">OBADA OUTABACHI</text>
    </clipPath>
  </defs>

  <style>
    text {
      user-select: none;
      -webkit-user-select: none;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="700" fill="url(#voidGradient)"/>

  <!-- Layer 0: Drifting Nebular Cloud Volumes -->
  <g id="nebulaGroup" style="mix-blend-mode: screen; pointer-events: none;">
    <ellipse cx="420" cy="310" rx="380" ry="240" fill="url(#nebulaA)" filter="url(#nebulaDust)"/>
    <ellipse cx="820" cy="420" rx="340" ry="210" fill="url(#nebulaB)" filter="url(#nebulaDust)"/>
    <circle cx="600" cy="350" r="460" fill="url(#nebulaA)" opacity="0.4" filter="url(#nebulaDust)"/>
  </g>

  <!-- Layer 1: Distant Parallax Stars & Dust -->
  <g id="layerDeepDust" opacity="0.65"></g>

  <!-- Layer 2: Abstract Neural Network Grid -->
  <g id="neuralLayer" opacity="0.45">
    <path id="neuralLinesPath" d="M 120 220 L 260 150 M 260 150 L 380 280 M 120 220 L 220 390 M 380 280 L 220 390 M 380 280 L 440 460 M 220 390 L 440 460 M 780 180 L 920 130 M 920 130 L 1060 260 M 780 180 L 860 420 M 1060 260 L 860 420 M 1060 260 L 1020 520 M 860 420 L 1020 520 M 440 460 L 600 580 M 860 420 L 600 580" fill="none" stroke="#2a3340" stroke-width="0.8" stroke-dasharray="3, 5"/>
    <g id="neuralNodesGroup">
      <circle cx="120" cy="220" r="2.2" fill="#4b5568"/>
      <circle cx="260" cy="150" r="2.2" fill="#4b5568"/>
      <circle cx="380" cy="280" r="2.2" fill="#4b5568"/>
      <circle cx="220" cy="390" r="2.2" fill="#4b5568"/>
      <circle cx="440" cy="460" r="2.2" fill="#4b5568"/>
      <circle cx="780" cy="180" r="2.2" fill="#4b5568"/>
      <circle cx="920" cy="130" r="2.2" fill="#4b5568"/>
      <circle cx="1060" cy="260" r="2.2" fill="#4b5568"/>
      <circle cx="860" cy="420" r="2.2" fill="#4b5568"/>
      <circle cx="1020" cy="520" r="2.2" fill="#4b5568"/>
      <circle cx="600" cy="580" r="2.2" fill="#4b5568"/>
    </g>
  </g>

  <!-- Layer 3: AI Silhouettes & Micro-Drones -->
  <g id="aiElementsLayer">
    <g id="aiRelic1" transform="translate(180, 160) scale(1.6)" opacity="0.28">
      <use href="#aiSilhouetteNode"/>
    </g>
    <g id="aiRelic2" transform="translate(1010, 480) scale(1.2) rotate(35)" opacity="0.22">
      <use href="#aiSilhouetteNode"/>
    </g>

    <g id="drone1" transform="translate(240, 480)">
      <use href="#microDrone"/>
    </g>
    <g id="drone2" transform="translate(960, 220) rotate(15)">
      <use href="#microDrone"/>
    </g>
    <g id="drone3" transform="translate(560, 120) rotate(-40)">
      <use href="#microDrone" transform="scale(0.7)"/>
    </g>
  </g>

  <!-- Layer 4: Telemetry Guides & HUD -->
  <g id="telemetryLayer" opacity="0.38">
    <use href="#hudReticle" x="140" y="100"/>
    <use href="#hudReticle" x="1060" y="100"/>
    <use href="#hudReticle" x="140" y="600"/>
    <use href="#hudReticle" x="1060" y="600"/>

    <circle cx="600" cy="350" r="320" fill="none" stroke="#1d232c" stroke-width="0.6" stroke-dasharray="4, 18"/>
    <circle cx="600" cy="350" r="230" fill="none" stroke="#1d232c" stroke-width="0.5" stroke-dasharray="1, 8"/>

    <text x="160" y="104" fill="#4d596b" font-size="8" font-family="monospace" letter-spacing="2">DEEP_VOID // SECTOR 0x09F</text>
    <text x="160" y="604" fill="#4d596b" font-size="8" font-family="monospace" letter-spacing="2">GRAV_NULL: 0.0000 G</text>
    <text x="960" y="604" fill="#4d596b" font-size="8" font-family="monospace" letter-spacing="2" text-anchor="end">NEURAL_TELEMETRY: STABLE</text>
  </g>

  <!-- Layer 5: Hero Typography Cluster -->
  <g id="heroCluster" transform="translate(600, 350)">
    <!-- 3D Under-Shadows -->
    <g id="textShadowLayer">
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-family="'Space Grotesk', 'Syne', -apple-system, sans-serif" font-size="78" font-weight="900" letter-spacing="12" fill="#000000" opacity="0.9" filter="url(#obsidianDepth)" transform="translate(0, 14)">OBADA OUTABACHI</text>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-family="'Space Grotesk', 'Syne', -apple-system, sans-serif" font-size="78" font-weight="900" letter-spacing="12" fill="#080a0e" opacity="0.8" transform="translate(0, 6)">OBADA OUTABACHI</text>
    </g>

    <!-- Gunmetal Core Typography -->
    <text id="heroTextBase" x="0" y="0" text-anchor="middle" dominant-baseline="central" font-family="'Space Grotesk', 'Syne', -apple-system, sans-serif" font-size="78" font-weight="900" letter-spacing="12" fill="url(#gunmetalGrad)" filter="url(#metalNoise)">OBADA OUTABACHI</text>

    <!-- Specular Highlight Sheen -->
    <text id="heroTextStroke" x="0" y="0" text-anchor="middle" dominant-baseline="central" font-family="'Space Grotesk', 'Syne', -apple-system, sans-serif" font-size="78" font-weight="900" letter-spacing="12" fill="none" stroke="url(#gunmetalSpecular)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">OBADA OUTABACHI</text>

    <!-- Sweeping Edge Light Scanner Line -->
    <g clip-path="url(#textClipMask)">
      <rect id="gleamSweep" x="-600" y="-80" width="220" height="160" fill="url(#edgeGleamGrad)" transform="skewX(-25)" mix-blend-mode="overlay" opacity="0.6"/>
    </g>

    <!-- Metadata Subtitle -->
    <g transform="translate(0, 72)" opacity="0.6">
      <line x1="-160" y1="0" x2="160" y2="0" stroke="#374151" stroke-width="0.8"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#718096" stroke-width="1.4"/>
      <text y="22" text-anchor="middle" fill="#6b7a90" font-size="11" font-family="monospace" letter-spacing="7" font-weight="500">AUTONOMOUS SYSTEMS // ZERO GRAVITY</text>
    </g>

    <!-- Bracket Accents -->
    <path d="M -490 -45 L -510 -45 L -510 45 L -490 45" fill="none" stroke="#36404e" stroke-width="1.5" opacity="0.5"/>
    <path d="M 490 -45 L 510 -45 L 510 45 L 490 45" fill="none" stroke="#36404e" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Foreground Border Frame -->
  <rect width="1200" height="700" fill="none" stroke="#040507" stroke-width="2" pointer-events="none"/>

  <!-- Embedded Dynamic Engine -->
  <script type="text/javascript">
    <![CDATA[
    (function() {
      const WIDTH = 1200;
      const HEIGHT = 700;
      const CX = 600;
      const CY = 350;

      const heroCluster = document.getElementById('heroCluster');
      const gleamSweep = document.getElementById('gleamSweep');
      const nebulaGroup = document.getElementById('nebulaGroup');
      const layerDeepDust = document.getElementById('layerDeepDust');
      const neuralNodesGroup = document.getElementById('neuralNodesGroup');
      const neuralLinesPath = document.getElementById('neuralLinesPath');
      const drone1 = document.getElementById('drone1');
      const drone2 = document.getElementById('drone2');
      const drone3 = document.getElementById('drone3');
      const aiRelic1 = document.getElementById('aiRelic1');
      const aiRelic2 = document.getElementById('aiRelic2');

      let startTime = null;

      // 1. Particle Dust
      const particles = [];
      const PARTICLE_COUNT = 64;
      layerDeepDust.innerHTML = '';
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = {
          x: (Math.sin(i * 99.7) * 0.5 + 0.5) * WIDTH,
          y: (Math.cos(i * 33.1) * 0.5 + 0.5) * HEIGHT,
          r: (i % 7 === 0) ? 1.5 : (i % 3 === 0 ? 1.0 : 0.6),
          speedX: ((i % 5) - 2) * 0.04 - 0.02,
          speedY: -0.06 - ((i % 4) * 0.02),
          baseOpacity: 0.15 + (i % 5) * 0.1,
          twinkleFreq: 0.001 + (i % 9) * 0.0006,
          twinklePhase: i * 1.7
        };
        particles.push(p);

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', p.x);
        circle.setAttribute('cy', p.y);
        circle.setAttribute('r', p.r);
        circle.setAttribute('fill', i % 4 === 0 ? '#8da0b8' : '#4b5563');
        circle.setAttribute('opacity', p.baseOpacity);
        layerDeepDust.appendChild(circle);
        p.el = circle;
      }

      // 2. Neural Nodes
      const nodes = [
        { x: 120, y: 220 }, { x: 260, y: 150 }, { x: 380, y: 280 },
        { x: 220, y: 390 }, { x: 440, y: 460 }, { x: 780, y: 180 },
        { x: 920, y: 130 }, { x: 1060, y: 260 }, { x: 860, y: 420 },
        { x: 1020, y: 520 }, { x: 600, y: 580 }
      ];

      const nodeElements = Array.from(neuralNodesGroup.querySelectorAll('circle'));
      nodes.forEach((node, idx) => {
        node.ox = node.x;
        node.oy = node.y;
        node.el = nodeElements[idx];
      });

      const edges = [
        [0, 1], [1, 2], [0, 3], [2, 3], [2, 4], [3, 4],
        [5, 6], [6, 7], [5, 8], [7, 8], [7, 9], [8, 9],
        [4, 10], [8, 10]
      ];

      // 3. Animation Loop
      function tick(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;

        // Levitation
        const floatY = Math.sin(elapsed * 0.00095) * 11 + Math.sin(elapsed * 0.0017) * 3.5;
        const floatX = Math.cos(elapsed * 0.00062) * 5;
        const tiltRot = Math.sin(elapsed * 0.00085 + 0.4) * 1.15;
        const microScale = 1 + Math.sin(elapsed * 0.0007) * 0.006;
        heroCluster.setAttribute('transform', `translate(${CX + floatX}, ${CY + floatY}) rotate(${tiltRot}) scale(${microScale})`);

        // Typography Gleam Sweep
        const gleamCycle = (elapsed * 0.28) % 2400;
        gleamSweep.setAttribute('x', -700 + gleamCycle);

        // Nebula Drift
        const nebX = Math.sin(elapsed * 0.0003) * 16;
        const nebY = Math.cos(elapsed * 0.0004) * 12;
        nebulaGroup.setAttribute('transform', `translate(${nebX}, ${nebY})`);

        // Particle Twinkling & Motion
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const p = particles[i];
          let curX = (p.x + elapsed * p.speedX) % WIDTH;
          if (curX < 0) curX += WIDTH;
          let curY = (p.y + elapsed * p.speedY) % HEIGHT;
          if (curY < 0) curY += HEIGHT;

          p.el.setAttribute('cx', curX);
          p.el.setAttribute('cy', curY);

          const tw = p.baseOpacity + Math.sin(elapsed * p.twinkleFreq + p.twinklePhase) * 0.18;
          p.el.setAttribute('opacity', Math.max(0.04, Math.min(0.85, tw)));
        }

        // Neural Network Drift
        nodes.forEach((n, i) => {
          n.x = n.ox + Math.sin(elapsed * 0.0008 + i) * 14;
          n.y = n.oy + Math.cos(elapsed * 0.0009 + i * 1.3) * 10;
          if (n.el) {
            n.el.setAttribute('cx', n.x);
            n.el.setAttribute('cy', n.y);
          }
        });

        let pathD = '';
        for (let j = 0; j < edges.length; j++) {
          const [a, b] = edges[j];
          pathD += `M ${nodes[a].x} ${nodes[a].y} L ${nodes[b].x} ${nodes[b].y} `;
        }
        neuralLinesPath.setAttribute('d', pathD);

        // Drones & Relics
        const d1x = 240 + Math.sin(elapsed * 0.0007) * 28;
        const d1y = 480 + Math.cos(elapsed * 0.0009) * 18;
        drone1.setAttribute('transform', `translate(${d1x}, ${d1y}) rotate(${Math.sin(elapsed * 0.001) * 8 - 10})`);

        const d2x = 960 + Math.cos(elapsed * 0.0008) * 32;
        const d2y = 220 + Math.sin(elapsed * 0.0011) * 16;
        drone2.setAttribute('transform', `translate(${d2x}, ${d2y}) rotate(${15 + Math.sin(elapsed * 0.0012) * 12})`);

        const d3x = 560 + Math.sin(elapsed * 0.0005) * 45;
        const d3y = 120 + Math.cos(elapsed * 0.0006) * 10;
        drone3.setAttribute('transform', `translate(${d3x}, ${d3y}) rotate(-40)`);

        aiRelic1.setAttribute('transform', `translate(${180 + Math.sin(elapsed * 0.0004) * 10}, ${160 + Math.cos(elapsed * 0.0005) * 8}) scale(1.6) rotate(${(elapsed * 0.004) % 360} 12 12)`);
        aiRelic2.setAttribute('transform', `translate(${1010 - Math.cos(elapsed * 0.0005) * 12}, ${480 + Math.sin(elapsed * 0.0004) * 10}) scale(1.2) rotate(${35 + Math.sin(elapsed * 0.0006) * 14} 12 12)`);

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
    ]]>
  </script>
</svg>
